name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airklim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json
    
    - name: Install dependencies
      run: |
        cd server
        npm ci
    
    - name: Run linting
      run: |
        cd server
        npm run lint
    
    - name: Seed test database
      run: |
        cd server
        node database/seed.js
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/airklim_test
        JWT_SECRET: test_secret_key
        NODE_ENV: test

    - name: Run unit tests (with coverage)
      run: |
        cd server
        npm test
      env:
        JWT_SECRET: test_secret_key
        NODE_ENV: test

    - name: Run integration tests against Postgres
      run: |
        cd server
        npx jest --selectProjects integration
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/airklim_test
        JWT_SECRET: test_secret_key
        NODE_ENV: test
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./server/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type-check and build
      run: npm run build

  docker-smoke:
    name: Docker Compose smoke test
    needs: [test, frontend]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    # Build images exactly as they would be built for deployment.
    # server/Dockerfile gates the backend image on `npm test` passing.
    - name: Build all images
      run: docker compose build

    # One-shot seeder service creates schema + seed data and exits 0.
    - name: Run database seeder
      run: docker compose run --rm seeder

    - name: Start stack
      run: docker compose up -d

    - name: Wait for backend healthcheck to report healthy
      run: |
        for i in $(seq 1 60); do
          status=$(docker inspect --format '{{.State.Health.Status}}' airklim-backend 2>/dev/null || echo starting)
          echo "attempt $i: backend=$status"
          if [ "$status" = "healthy" ]; then exit 0; fi
          sleep 5
        done
        echo "::error::backend never became healthy"
        docker compose logs backend
        exit 1

    - name: Verify /health endpoint responds 200
      run: |
        for i in $(seq 1 12); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health || echo 000)
          echo "attempt $i: backend /health HTTP $code"
          if [ "$code" = "200" ]; then exit 0; fi
          sleep 5
        done
        echo "::error::/health never returned 200"
        docker compose logs backend
        exit 1

    - name: Verify frontend is served by nginx
      run: |
        for i in $(seq 1 12); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/ || echo 000)
          echo "attempt $i: frontend HTTP $code"
          if [ "$code" = "200" ]; then exit 0; fi
          sleep 5
        done
        echo "::error::frontend never responded 200"
        docker compose logs frontend
        exit 1

    - name: Show final container states
      if: always()
      run: docker ps -a --format 'table {{.Names}}\t{{.Status}}'

  build:
    needs: [test, frontend, docker-smoke]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./server
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/airklim-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/airklim-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to production
      run: |
        echo "Deploying to production..."
        # Add your deployment script here
        # Example: SSH to server and pull latest image
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
