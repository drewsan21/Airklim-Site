version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: airklim-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airklim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - airklim-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: airklim-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/airklim
      JWT_SECRET: your_super_secret_jwt_key_change_in_production
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - airklim-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (nginx serving the built Vite bundle)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: airklim-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - airklim-network

  # Database seeder (Node script — runs once and exits).
  # Creates the schema (config/database.js initializeSchema) and test data.
  seeder:
    image: node:18-alpine
    container_name: airklim-seeder
    working_dir: /app
    command: sh -c "npm ci --omit=dev && node database/seed.js"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/airklim
    volumes:
      - ./server:/app
      - seeder_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - airklim-network

  # Redis (Optional - for caching)
  redis:
    image: redis:7-alpine
    container_name: airklim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - airklim-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer (Database GUI)
  adminer:
    image: adminer:latest
    container_name: airklim-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - airklim-network

  # MailHog (Email Testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: airklim-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - airklim-network

volumes:
  postgres_data:
  redis_data:
  seeder_node_modules:

networks:
  airklim-network:
    driver: bridge
